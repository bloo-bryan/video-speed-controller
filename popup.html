<!DOCTYPE html>
<html>
<head>
  <title>Video Speed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <label for="speedSlider">Speed:</label>
    <span id="speedValue">1.0</span>x
    <input type="range" id="speedSlider" min="0.1" max="8" step="0.1" value="1.0">
    <button id="resetButton">Reset (1x)</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
